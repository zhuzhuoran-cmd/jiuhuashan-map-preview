<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef0e9">
<meta name="robots" content="noindex,nofollow">
<title>九华山 · 三维实地导览</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
</head><body><main id="app">
<div id="stage" role="img" aria-label="九华山可交互三维模型：拖动旋转，滚轮缩放，右键平移"></div>

<header class="brand glass">
 <div class="brand-row"><div class="seal" aria-hidden="true">九<br>华</div><div class="brand-text"><h1>九华山</h1><p>三维实地导览 · 走近九华</p></div></div>
 <button id="featured-cta" class="featured-cta" type="button" aria-label="查看居之林民宿">
  <span class="cta-pin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4.5l8 6.7V19a1 1 0 0 1-1 1h-4.6v-5.2H9.6V20H5a1 1 0 0 1-1-1z"/></svg></span>
  <span class="cta-text"><b>居之林民宿</b><small>凤形新村 19 号 · 带您看看</small></span>
  <svg class="cta-go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
 </button>
</header>

<nav class="viewbar glass" aria-label="地图视角"><span class="seg-ind" aria-hidden="true"></span><button data-view="town" class="active">九华街</button><button data-view="all">全山</button><button data-view="top">俯视</button><button data-view="baisui">百岁宫</button><button data-view="tiantai">天台</button></nav>

<aside id="panel" class="directory glass" aria-label="地点搜索">
 <div class="sheet-grip" aria-hidden="true"></div>
 <div class="panel-head"><div><span class="eyebrow">EXPLORE</span><h2>探索九华</h2></div><button id="panel-close" class="icon-btn" aria-label="收起地点面板"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
 <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" aria-label="搜索寺庙、景点或公共设施" placeholder="搜索寺庙、景点、车站、公厕…" autocomplete="off"></label>
 <div id="categories" class="categories"><button data-category="all" class="active">全部</button><button data-category="temple">寺庙</button><button data-category="sight">景点山水</button><button data-category="service">公共服务</button></div>
 <div class="list-summary" id="list-summary"></div>
 <div id="place-list" class="place-list" tabindex="0" role="region" aria-label="地点列表"></div>
 <button id="data-open" class="source-button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg><span>资料来源与精度说明</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</aside>
<button id="panel-open" class="panel-open glass"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>搜索地点</button>

<section id="settings" class="settings glass">
 <button id="settings-toggle" class="settings-title" aria-expanded="true" aria-controls="settings-body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8 4.2-8 4.2-8-4.2z"/><path d="m4 12.2 8 4.2 8-4.2M4 16l8 4.2 8-4.2"/></svg><span>图层</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
 <div class="settings-wrap"><div id="settings-body">
  <label class="switch"><input type="checkbox" id="layer-buildings" checked><span class="track" aria-hidden="true"></span><span>建筑细节</span></label>
  <label class="switch"><input type="checkbox" id="layer-trees" checked><span class="track" aria-hidden="true"></span><span>山林植被</span></label>
  <label class="switch"><input type="checkbox" id="layer-labels" checked><span class="track" aria-hidden="true"></span><span>地点标注</span></label>
  <label class="switch"><input type="checkbox" id="layer-estimates" checked><span class="track" aria-hidden="true"></span><span>待核位置</span></label>
  <label class="switch"><input type="checkbox" id="layer-trails" checked><span class="track" aria-hidden="true"></span><span>步道与台阶</span></label>
  <div class="height-control"><div class="hc-row"><span>地形高度</span><output id="height-value">真实比例 ×1.0</output></div><input id="height" aria-label="地形高度比例" type="range" min="1" max="1.8" step="0.1" value="1"></div>
 </div></div>
</section>

<div class="map-actions glass">
 <button id="north" aria-label="朝北"><svg id="north-arrow" viewBox="0 0 24 24" aria-hidden="true"><path class="n" d="M12 3.5 16 12H8z"/><path class="s" d="M12 20.5 8 12h8z"/></svg></button>
 <span class="sep"></span>
 <button id="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
 <button id="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
 <span class="sep"></span>
 <button id="capture" aria-label="保存当前三维画面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2L16.5 7h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.3"/></svg></button>
</div>

<div class="status glass"><span class="status-dot"></span><span id="scene-status">加载模型中</span><span id="scale-line"></span></div>

<section id="card" class="info-card glass" hidden aria-live="polite"></section>

<dialog id="data-dialog"><div class="dialog-head"><div><span class="eyebrow">ABOUT THIS MODEL</span><h2>这座模型，依据什么建成</h2></div><button id="data-close" class="icon-btn" aria-label="关闭资料说明"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="data-content" tabindex="0" autofocus role="region" aria-label="资料说明内容"></div></dialog>

<div id="loading" class="loading">
 <svg class="load-art" viewBox="0 0 160 70" aria-hidden="true"><path class="far" d="M2 60 30 34l14 10 22-26 20 18 14-12 26 22 18-10 12 24"/><path class="near" d="M2 66 24 50l18 8 26-20 22 16 18-12 24 14 26-4"/></svg>
 <h2>九华山</h2><p id="load-text">读取地形与真实建筑轮廓</p><div class="load-bar"><span></span></div><button id="reload" class="reload-btn" type="button" hidden>重新加载</button>
</div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="居之林民宿实拍照片" hidden><div class="viewer-strip"></div><button class="viewer-close icon-btn" type="button" aria-label="关闭照片"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="viewer-prev icon-btn" type="button" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button><button class="viewer-next icon-btn" type="button" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button><div class="viewer-count" aria-live="polite"></div></div>
<div id="toast" role="status" hidden></div>
</main><script type="module" src="app.js"></script></body></html>
